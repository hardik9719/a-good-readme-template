apiVersion: v1
kind: ConfigMap
metadata:
  name: leetcode-oauth-config
  namespace: leetcode-oauth
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  ENABLE_API_DOCS: "false"
  ENABLE_METRICS: "true"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "900000"
  NEXT_TELEMETRY_DISABLED: "1"
