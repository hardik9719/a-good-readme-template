apiVersion: apps/v1
kind: Deployment
metadata:
  name: leetcode-oauth-app
  namespace: leetcode-oauth
  labels:
    app: leetcode-oauth-app
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: leetcode-oauth-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: leetcode-oauth-app
        version: v1
    spec:
      containers:
      - name: app
        image: your-registry/leetcode-oauth-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: leetcode-oauth-config
              key: PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: leetcode-oauth-config
              key: NODE_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: leetcode-oauth-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: DATABASE_URL
        - name: DIRECT_URL
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: DIRECT_URL
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: NEXTAUTH_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: NEXTAUTH_SECRET
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: NEXT_PUBLIC_SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: NEXT_PUBLIC_SUPABASE_URL
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: leetcode-oauth-secrets
              key: SUPABASE_SERVICE_ROLE_KEY
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
